version: 2
updates:
  # The actions in .github/workflows are pinned to full commit SHAs, and a pin
  # without an updater only gets older. This block opens a pull request when a
  # pinned action has a new release. The project has no npm dependencies.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      all-actions:
        patterns:
          - "*"
